  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f8f9fa;
      --text: #191c1e;
      --text-muted: #5c6370;
      --line: #e3e5e8;
      --line-subtle: #edf0f3;
      --link: #0969da;
      --link-hover: #054da7;
      --chip-bg: #f2f4f7;
      --chip-text: #374151;
      --chip-active-bg: #191c1e;
      --chip-active-text: #ffffff;
      --focus-ring: #0969da;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      --serif: "Charter", "Bitstream Charter", "Sitka Text", "Source Serif Pro", Georgia, serif;
    }

    [data-theme="dark"] {
      --bg: #141414;
      --bg-subtle: #1f1f1f;
      --text: #ededed;
      --text-muted: #949494;
      --line: #2b2b2b;
      --line-subtle: #222222;
      --link: #6ba6ed;
      --link-hover: #93c5fd;
      --chip-bg: #202020;
      --chip-text: #cfcfcf;
      --chip-active-bg: #ededed;
      --chip-active-text: #141414;
      --focus-ring: #6ba6ed;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* Top bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.15s;
    }
    .nav-back:hover { color: var(--text); }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-control {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-muted);
      padding: 4px 9px;
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn-control:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }
    .btn-control.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* Header */
    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 4px;
    }

    .meta-line {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Search & Filter */
    .filter-bar {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      font-size: 13.5px;
      font-family: var(--sans);
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--bg-subtle);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .search-input:focus {
      border-color: var(--focus-ring);
      background: var(--bg);
    }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      width: 14px;
      height: 14px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: var(--chip-bg);
      color: var(--chip-text);
      border: 1px solid transparent;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .chip:hover {
      border-color: var(--line);
    }
    .chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
    }

    /* Reference List */
    .ref-list {
      list-style: none;
    }

    .ref-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--line-subtle);
    }
    .ref-item:last-child {
      border-bottom: 0;
    }

    /* Standard Academic Hanging Indent for APA */
    .apa-citation {
      font-family: var(--serif);
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text);
      padding-left: 28px;
      text-indent: -28px;
      word-wrap: break-word;
    }

    /* IEEE Numbered Format */
    .ieee-citation {
      font-family: var(--serif);
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text);
      display: flex;
      gap: 10px;
      word-wrap: break-word;
    }
    .ieee-num {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .ref-journal {
      font-style: italic;
    }

    .doi-link {
      display: inline-block;
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--link);
      text-decoration: none;
      word-break: break-all;
      margin-top: 3px;
    }
    .doi-link:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    /* Action buttons below citation */
    .ref-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding-left: 28px;
    }
    .ieee-active .ref-actions {
      padding-left: 32px;
    }

    .act-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.12s;
    }
    .act-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
      background: var(--bg-subtle);
    }

    .category-label {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-muted);
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .empty-state {
      padding: 40px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      display: none;
    }

    /* Minimal Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--text);
      color: var(--bg);
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.16s ease, opacity 0.16s ease;
      z-index: 100;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 640px) {
      .container { padding: 20px 16px 60px; }
      .top-nav { flex-direction: column; align-items: flex-start; gap: 12px; }
      .nav-controls { width: 100%; justify-content: space-between; }
      .apa-citation { padding-left: 0; text-indent: 0; }
      .ref-actions { padding-left: 0; }
      .ieee-active .ref-actions { padding-left: 0; }
    }
  </style>

    let currentStyle = 'apa';
    let currentCategory = 'all';
    let searchQuery = '';

    const refList = document.getElementById('refList');
    const emptyState = document.getElementById('emptyState');
    const toast = document.getElementById('toast');
    const countEl = document.getElementById('citationCount');

    const categoryNames = {
      all: 'All',
      pyrolysis: 'Mobile Pyrolysis',
      feedstock: 'Feedstock & Residues',
      economics: 'Economics & LCA',
      logistics: 'GIS & Logistics',
      policy: 'National Policy'
    };

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next === 'dark' ? 'dark' : '');
      document.getElementById('btnTheme').textContent = next === 'dark' ? 'Light' : 'Dark';
      localStorage.setItem('oratory-theme', next);
    }

    if (localStorage.getItem('oratory-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('btnTheme').textContent = 'Light';
    }

    function setStyle(style) {
      currentStyle = style;
      document.getElementById('btnStyleApa').classList.toggle('active', style === 'apa');
      document.getElementById('btnStyleIeee').classList.toggle('active', style === 'ieee');
      if (style === 'ieee') {
        refList.classList.add('ieee-active');
      } else {
        refList.classList.remove('ieee-active');
      }
      render();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', c.getAttribute('data-cat') === cat);
      });
      render();
    }

    function buildCategoryChips() {
      const counts = { all: DATA.length };
      DATA.forEach(d => {
        counts[d.category] = (counts[d.category] || 0) + 1;
      });

      const container = document.getElementById('categoryChips');
      container.innerHTML = '';

      const cats = ['all', 'pyrolysis', 'feedstock', 'economics', 'logistics', 'policy'];
      cats.forEach(c => {
        if (!counts[c] && c !== 'all') return;
        const btn = document.createElement('button');
        btn.className = 'chip' + (c === currentCategory ? ' active' : '');
        btn.setAttribute('data-cat', c);
        btn.textContent = `${categoryNames[c] || c} (${counts[c] || 0})`;
        btn.onclick = () => setCategory(c);
        container.appendChild(btn);
      });
    }

    function filterRefs() {
      searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      render();
    }

    function formatApa(item) {
      const parts = [];
      parts.push(`${item.authors} (${item.year}). `);

      if (item.type === 'book') {
        parts.push(`<span class="ref-journal">${item.title}</span>. `);
        if (item.publisher) parts.push(`${item.publisher}. `);
      } else if (item.type === 'report') {
        parts.push(`<span class="ref-journal">${item.title}</span>. `);
        if (item.publisher) parts.push(`${item.publisher}. `);
      } else {
        parts.push(`${item.title}. `);
        if (item.journal) {
          parts.push(`<span class="ref-journal">${item.journal}</span>`);
          if (item.volume) parts.push(`, ${item.volume}`);
          if (item.issue) parts.push(`(${item.issue})`);
          if (item.pages) parts.push(`, ${item.pages}`);
          parts.push('. ');
        }
      }

      return parts.join('');
    }

    function formatIeee(item, index) {
      const parts = [];
      if (item.type === 'book') {
        parts.push(`${item.authors}, <span class="ref-journal">${item.title}</span>. ${item.publisher || ''}, ${item.year}.`);
      } else if (item.type === 'report') {
        parts.push(`${item.authors}, "${item.title}," ${item.publisher || ''}, ${item.year}.`);
      } else {
        parts.push(`${item.authors}, "${item.title}," <span class="ref-journal">${item.journal || ''}</span>`);
        if (item.volume) parts.push(`, vol. ${item.volume}`);
        if (item.issue) parts.push(`, no. ${item.issue}`);
        if (item.pages) parts.push(`, pp. ${item.pages}`);
        parts.push(`, ${item.year}.`);
      }
      return parts.join('');
    }

    function copyToClipboard(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`Copied ${label}`);
        }).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      const t = document.createElement('textarea');
      t.value = text;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
      showToast(`Copied ${label}`);
    }

    function copyCitation(index) {
      const item = DATA[index];
      let plain = '';
      if (currentStyle === 'ieee') {
        const base = item.type === 'book'
          ? `${item.authors}, ${item.title}. ${item.publisher || ''}, ${item.year}.`
          : `${item.authors}, "${item.title}," ${item.journal || ''}` + (item.volume ? `, vol. ${item.volume}` : '') + (item.pages ? `, pp. ${item.pages}` : '') + `, ${item.year}.`;
        const link = item.doi ? ` https://doi.org/${item.doi}` : (item.url ? ` ${item.url}` : '');
        plain = `${base}${link}`;
      } else {
        let base = `${item.authors} (${item.year}). ${item.title}. `;
        if (item.journal) base += `${item.journal}`;
        if (item.volume) base += `, ${item.volume}`;
        if (item.pages) base += `, ${item.pages}.`;
        else base += '.';
        const link = item.doi ? ` https://doi.org/${item.doi}` : (item.url ? ` ${item.url}` : '');
        plain = `${base}${link}`;
      }
      copyToClipboard(plain, `${currentStyle.toUpperCase()} citation`);
    }

    function copyBibtex(index) {
      const item = DATA[index];
      copyToClipboard(item.bibtex, 'BibTeX');
    }

    function exportBibtexAll() {
      const bib = DATA.map(d => d.bibtex).join('\n\n');
      const blob = new Blob([bib], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'oratory_references.bib';
      a.click();
      showToast('Downloaded oratory_references.bib');
    }

    function render() {
      refList.innerHTML = '';
      let visibleCount = 0;

      const filtered = DATA.filter(item => {
        if (currentCategory !== 'all' && item.category !== currentCategory) {
          return false;
        }
        if (searchQuery) {
          const hay = (item.title + ' ' + item.authors + ' ' + (item.journal || '') + ' ' + item.year + ' ' + (item.doi || '')).toLowerCase();
          if (!hay.includes(searchQuery)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
        countEl.textContent = '0 sources';
        return;
      } else {
        emptyState.style.display = 'none';
        countEl.textContent = `${filtered.length} of ${DATA.length} sources`;
      }

      filtered.forEach(item => {
        visibleCount++;
        const globalIdx = DATA.indexOf(item);
        const li = document.createElement('li');
        li.className = 'ref-item';

        const doiHref = item.doi ? `https://doi.org/${item.doi}` : (item.url || '#');
        const doiLabel = item.doi ? `https://doi.org/${item.doi}` : (item.url || '');

        let citationHtml = '';
        if (currentStyle === 'ieee') {
          citationHtml = `
            <div class="ieee-citation">
              <span class="ieee-num">[${visibleCount}]</span>
              <div>
                <div>${formatIeee(item, visibleCount)}</div>
                ${doiLabel ? `<a href="${doiHref}" target="_blank" rel="noopener noreferrer" class="doi-link">${doiLabel}</a>` : ''}
              </div>
            </div>
          `;
        } else {
          citationHtml = `
            <div class="apa-citation">
              ${formatApa(item)}
              ${doiLabel ? `<br><a href="${doiHref}" target="_blank" rel="noopener noreferrer" class="doi-link">${doiLabel}</a>` : ''}
            </div>
          `;
        }

        const actionsHtml = `
          <div class="ref-actions">
            <button class="act-btn" onclick="copyCitation(${globalIdx})">Copy ${currentStyle.toUpperCase()}</button>
            <button class="act-btn" onclick="copyBibtex(${globalIdx})">BibTeX</button>
            ${item.doi ? `<a href="${doiHref}" target="_blank" rel="noopener noreferrer" class="act-btn">DOI ↗</a>` : ''}
            <span class="category-label">${categoryNames[item.category] || item.category}</span>
          </div>
        `;

        li.innerHTML = citationHtml + actionsHtml;
        refList.appendChild(li);
      });
    }

    buildCategoryChips();
    render();
  </script>
